# Pre-commit configuration for version1
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: lock-check
        name: uv lock consistency check
        entry: uv lock --check
        language: system
        pass_filenames: false

      - id: format-check
        name: ruff format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false

      - id: lint
        name: ruff lint check
        entry: uv run ruff check .
        language: system
        pass_filenames: false

      - id: codespell
        name: codespell
        entry: uv run codespell
        language: system
        pass_filenames: false

      - id: tests
        name: pytest test suite
        entry: uv run pytest tests/unit tests/integration
        language: system
        pass_filenames: false
