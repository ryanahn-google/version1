steps:
  # Terraform Format Check
  - name: "hashicorp/terraform:1.9.5"
    id: terraform-fmt
    dir: "deployment/terraform/cicd"
    args:
      - "fmt"
      - "-check"
      - "-recursive"

  # Terraform Init
  - name: "hashicorp/terraform:1.9.5"
    id: terraform-init
    dir: "deployment/terraform/cicd"
    args:
      - "init"
      - "-input=false"

  # Terraform Validate
  - name: "hashicorp/terraform:1.9.5"
    id: terraform-validate
    dir: "deployment/terraform/cicd"
    args:
      - "validate"


  # Install uv package manager and sync dependencies
  - name: "gcr.io/cloud-builders/gcloud"
    id: install-dependencies
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        curl -LsSf https://astral.sh/uv/0.11.7/install.sh | sh
        export PATH="$$HOME/.local/bin:$$PATH"
        uv sync --locked

  # Check for Alembic schema drift and ungenerated migrations
  - name: "gcr.io/cloud-builders/gcloud"
    id: check-db-migrations
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        export PATH="$$HOME/.local/bin:$$PATH"
        uv run alembic upgrade head
        uv run alembic check

  # Build React 19 Frontend SPA
  - name: "node:24-alpine"
    id: build-frontend
    entrypoint: /bin/sh
    args:
      - "-c"
      - |
        cd frontend
        npm ci
        npm run build

  # Run unit tests using pytest
  - name: "gcr.io/cloud-builders/gcloud"
    id: unit-tests
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        export PATH="$$HOME/.local/bin:$$PATH"
        uv run pytest tests/unit

  # Run integration tests
  - name: "gcr.io/cloud-builders/gcloud"
    id: integration-tests
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        export PATH="$$HOME/.local/bin:$$PATH"
        uv run pytest tests/integration

logsBucket: gs://${PROJECT_ID}-version1-logs/build-logs
options:
  env:
    - 'UV_PYTHON=3.13'
    - 'CI=true'
    - 'INTEGRATION_TEST=true'
    # Integration tests run the agent in-process; pytest doesn't load .env.
    - 'GOOGLE_GENAI_USE_VERTEXAI=true'
    - 'GOOGLE_CLOUD_PROJECT=${PROJECT_ID}'
    - 'GOOGLE_CLOUD_LOCATION=global'
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
