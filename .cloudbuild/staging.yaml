steps:

  # Terraform Init
  - name: "hashicorp/terraform:1.9.5"
    id: terraform-init
    dir: "deployment/terraform/cicd"
    args:
      - "init"
      - "-input=false"

  # Terraform Apply (Auto-approved immediately upon merge to main)
  - name: "hashicorp/terraform:1.9.5"
    id: terraform-apply
    dir: "deployment/terraform/cicd"
    args:
      - "apply"
      - "-auto-approve"
      - "-input=false"
      - "-var-file=vars/env.tfvars"

  # Build and Push Orchestrator (Subagents strictly excluded from image)
  - name: "gcr.io/cloud-builders/docker"
    id: build-image
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        docker build \
          -t $_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO_NAME/$_CONTAINER_NAME:$SHORT_SHA \
          .
        docker push $_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO_NAME/$_CONTAINER_NAME:$SHORT_SHA

  # Deploy P1-P4 Sub-Agents exclusively to Vertex AI Agent Runtime
  - name: "gcr.io/cloud-builders/gcloud"
    id: deploy-subagents-staging
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        curl -LsSf https://astral.sh/uv/0.11.7/install.sh | sh
        export PATH="$$HOME/.local/bin:$$PATH"
        echo "Deploying P1-P4 Sub-Agents exclusively to Vertex AI Agent Runtime..."
        for agent in market_sensing strategy_brief creative_content performance_insights; do
          echo "Deploying $$agent to Agent Runtime..."
          (cd app/agents/$$agent && uvx google-agents-cli@1.3.1 deploy \
            --project ${_STAGING_PROJECT_ID} \
            --region ${_REGION} \
            --service-account version1-subagent@${_STAGING_PROJECT_ID}.iam.gserviceaccount.com \
            --update-env-vars="ARTIFACTS_BUCKET_NAME=${_STAGING_PROJECT_ID}-version1-artifacts,PROJECT_ID=${_STAGING_PROJECT_ID},GOOGLE_CLOUD_PROJECT=${_STAGING_PROJECT_ID},ENV=staging" \
            --no-wait) || true
          sleep 5
        done

  # Execute Database Migration Job (Alembic)
  - name: "gcr.io/cloud-builders/gcloud"
    id: db-migrate-staging
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        echo "Updating and executing Cloud Run migration job in staging..."
        gcloud run jobs update version1-db-migrate \
          --region ${_REGION} \
          --project ${_STAGING_PROJECT_ID} \
          --image $_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO_NAME/$_CONTAINER_NAME:$SHORT_SHA
        gcloud run jobs execute version1-db-migrate \
          --region ${_REGION} \
          --project ${_STAGING_PROJECT_ID} \
          --wait

  # Deploy Orchestrator to Cloud Run
  - name: "gcr.io/cloud-builders/gcloud"
    id: deploy-staging
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        curl -LsSf https://astral.sh/uv/0.11.7/install.sh | sh
        export PATH="$$HOME/.local/bin:$$PATH"
        uvx google-agents-cli@1.3.1 deploy \
          --project ${_STAGING_PROJECT_ID} \
          --region ${_REGION} \
          --service-name version1 \
          --image $_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO_NAME/$_CONTAINER_NAME:$SHORT_SHA \
          --update-env-vars="OTEL_RESOURCE_ATTRIBUTES=service.version=$COMMIT_SHA,GOOGLE_OAUTH_CLIENT_ID=${_STAGING_GOOGLE_OAUTH_CLIENT_ID}"

  # Fetch Staging Service URL
  - name: "gcr.io/cloud-builders/gcloud"
    id: fetch-staging-url
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        echo $(gcloud run services describe version1 \
        --region ${_REGION} --project ${_STAGING_PROJECT_ID} --format="value(status.url)") > staging_url.txt

  # Fetch ID Token
  - name: gcr.io/cloud-builders/gcloud
    id: fetch-id-token
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        echo $(gcloud auth print-identity-token -q) > id_token.txt
  - name: "gcr.io/cloud-builders/gcloud"
    id: load_test
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        curl -LsSf https://astral.sh/uv/0.11.7/install.sh | sh
        export PATH="$$HOME/.local/bin:$$PATH"
        export _ID_TOKEN=$(cat id_token.txt)
        export _STAGING_URL=$(cat staging_url.txt)
        uvx locust==2.31.1 \
        -f tests/load_test/load_test.py \
        --headless \
        -H $$_STAGING_URL \
        -t 30s -u 10 -r 0.5 \
        --csv=tests/load_test/.results/results \
        --html=tests/load_test/.results/report.html

  # Export Load Test Results to GCS
  - name: gcr.io/cloud-builders/gcloud
    id: export-results-to-gcs
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        export _TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        gsutil -m cp -r tests/load_test/.results gs://${_LOGS_BUCKET_NAME_STAGING}/load-test-results/results-$${_TIMESTAMP}
        echo "_________________________________________________________________________"
        echo "Load test results copied to gs://${_LOGS_BUCKET_NAME_STAGING}/load-test-results/results-$${_TIMESTAMP}"
        echo "HTTP link: https://console.cloud.google.com/storage/browser/${_LOGS_BUCKET_NAME_STAGING}/load-test-results/results-$${_TIMESTAMP}"
        echo "_________________________________________________________________________"

  # Trigger Prod Deployment
  - name: gcr.io/cloud-builders/gcloud
    id: trigger-prod-deployment
    entrypoint: gcloud
    args:
      - "beta"
      - "builds"
      - "triggers"
      - "run"
      - "deploy-version1"
      - "--region"
      - "$LOCATION"
      - "--project"
      - "$PROJECT_ID"
      - "--sha"
      - $COMMIT_SHA

  - name: gcr.io/cloud-builders/gcloud
    id: echo-view-build-trigger-link
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        echo "_________________________________________________________________________"
        echo "Production deployment triggered. View progress and / or approve on the Cloud Build Console:"
        echo "https://console.cloud.google.com/cloud-build/builds;region=$LOCATION"
        echo "_________________________________________________________________________"

substitutions:
  _STAGING_PROJECT_ID: YOUR_STAGING_PROJECT_ID
  _REGION: asia-northeast3
  _STAGING_GOOGLE_OAUTH_CLIENT_ID: ""

logsBucket: gs://${PROJECT_ID}-version1-logs/build-logs
options:
  env:
    - 'UV_PYTHON=3.13'
    - 'CI=true'
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
